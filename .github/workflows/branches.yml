name: Branches

# Deletes branches whose pull request is closed (merged or not) and that
# no open pull request still uses: right after a pull request closes, and
# daily to catch anything missed. Never deletes main, protected branches,
# branches with new commits since their pull request closed, or branches
# that never had a pull request (docs/ci.md, "Branch cleanup").
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted without deleting
        type: boolean
        default: false

permissions: {}

concurrency:
  group: branches
  cancel-in-progress: false

jobs:
  prune:
    name: Prune finished branches
    # Fork pull requests get a read-only token; the daily run covers them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # delete branch refs
      pull-requests: read
    steps:
      # Always the default branch's script, never the closed pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: .github/scripts/prune-branches.sh
