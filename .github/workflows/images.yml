name: Images

# Builds every image this repo ships and scans it with Trivy. Pull requests
# build and scan only; main also pushes the images to GHCR (amd64) with an
# SBOM and build provenance, and signs them with cosign when the
# COSIGN_PRIVATE_KEY secret is set. Signed images are then mirrored to
# registry.bridgemill.ch when REGISTRY_USER and REGISTRY_PASSWORD are set;
# GHCR stays the source. The version lives in VERSION: every pull
# request must raise it, and every push to main publishes the images as
# v<VERSION> and then creates the GitHub release v<VERSION>
# (docs/ci.md, "Versions and releases"). A release published by hand also
# adds arm64 to the node images for Mac minis.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions: {}

# Pull requests cancel superseded runs; main never does, so every merge
# gets its release.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/version.sh

  scan:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &images
        include:
          # Portal, castord, monitor, Telegram bot and admin CLI: one image,
          # one container each. The control plane runs on amd64. platforms
          # is what a release builds; main builds only linux/amd64.
          - name: castor
            image: castorcloud
            context: .
            file: Dockerfile
            platforms: linux/amd64
            # Rebuilt every time: its apk packages float, so a cached layer
            # would keep shipping fixed CVEs.
            fresh: runtime
          # Runs per tenant on nodes.
          - name: assistant-tools
            image: castorcloud-assistant-tools
            context: .
            file: agent/tools/Dockerfile
            platforms: linux/amd64,linux/arm64
          # Egress proxy of custom stacks, on every stacks node.
          - name: egress
            image: castorcloud-egress
            context: infra/node/egress
            file: infra/node/egress/Dockerfile
            platforms: linux/amd64,linux/arm64
          # Privileged LUKS helper on nodes; kept apart so nothing else runs privileged.
          - name: cryptd
            image: castorcloud-cryptd
            context: infra/node/cryptd
            file: infra/node/cryptd/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          no-cache-filters: ${{ matrix.fresh }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # HIGH and CRITICAL with a fix available fail the build. Accepted
      # findings live in .trivyignore, each with an expiry date.
      - name: Scan
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 --no-progress

  publish:
    name: Publish (${{ matrix.name }})
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    needs: [version, scan]
    runs-on: ubuntu-latest
    # A release's arm64 builds run under emulation: compiling Rust there
    # takes up to half an hour per image, so main skips them.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push images to GHCR
    strategy:
      fail-fast: false
      matrix: *images
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      COSIGN_KEY_SET: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
      # Mirror of GHCR (docs/ci.md, "Mirror"): same path, same digests.
      MIRROR: registry.bridgemill.ch/${{ github.repository_owner }}/${{ matrix.image }}
      MIRROR_SET: ${{ secrets.REGISTRY_USER != '' && secrets.REGISTRY_PASSWORD != '' }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'release'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the full commit SHA (immutable, what deployments pin), the
      # version and, for pushes to main, main.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ env.TAG }}
          labels: org.opencontainers.image.version=${{ env.TAG }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ github.event_name == 'release' && matrix.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          no-cache-filters: ${{ matrix.fresh }}

      # Signed with a private key, not keyless: keyless signing would publish
      # this private repo's name and workflow to the public Rekor log.
      # Verify with: cosign verify --key cosign.pub --insecure-ignore-tlog <image>@<digest>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.COSIGN_KEY_SET == 'true'
        with:
          # v2 writes the classic <digest>.sig signatures that
          # rust/crates/castord/src/images.rs checks.
          cosign-release: v2.6.1

      - name: Sign
        if: env.COSIGN_KEY_SET == 'true'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_KEY --tlog-upload=false "${IMAGE}@${DIGEST}"

      - name: Unsigned
        if: env.COSIGN_KEY_SET != 'true'
        run: echo "::notice::COSIGN_PRIVATE_KEY is not set, so ${IMAGE} is not signed."

      # Only signed images are mirrored, so a node pulling from the mirror
      # gets nothing GHCR's signature check wouldn't accept. cosign copy
      # keeps the digest and copies the signature, SBOM and attestations
      # with it. Over TLS only: there is no insecure-registry fallback.
      # An unreachable mirror warns but doesn't hold back the release.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        id: mirror-login
        if: env.COSIGN_KEY_SET == 'true' && env.MIRROR_SET == 'true'
        continue-on-error: true
        with:
          registry: registry.bridgemill.ch
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Mirror
        if: steps.mirror-login.outcome == 'success'
        continue-on-error: true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EVENT: ${{ github.event_name }}
        run: |
          tags=("$GITHUB_SHA" "$TAG")
          if [ "$EVENT" = push ]; then tags+=(main); fi
          for t in "${tags[@]}"; do
            cosign copy --force "${IMAGE}@${DIGEST}" "${MIRROR}:${t}"
          done
          echo "Mirrored to \`${MIRROR}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Not mirrored
        if: env.COSIGN_KEY_SET != 'true' || env.MIRROR_SET != 'true'
        run: echo "::notice::${IMAGE} is not mirrored (needs COSIGN_PRIVATE_KEY, REGISTRY_USER and REGISTRY_PASSWORD)."

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed \`${IMAGE}@${DIGEST}\` (tags \`${GITHUB_SHA}\`, \`${TAG}\`)" >> "$GITHUB_STEP_SUMMARY"

  # Created with GITHUB_TOKEN, so it does not start this workflow again.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
          echo "Released \`${TAG}\` at \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
