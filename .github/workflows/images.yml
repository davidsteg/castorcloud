name: Images

# Builds every image this repo ships and scans it with Trivy. Pull requests
# build and scan only; main also pushes the images to GHCR (node images for
# amd64 TrueNAS and arm64 Mac minis) with an SBOM and build provenance, and
# signs them with cosign when the COSIGN_PRIVATE_KEY secret is set. The
# version lives in VERSION: every pull request must raise it, and every push
# to main publishes the images as v<VERSION>, also to one private Docker Hub
# repository (only signed, only if that repository is private), and then
# creates the GitHub release v<VERSION> (docs/ci.md, "Versions and releases").
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions: {}

# Pull requests cancel superseded runs; main never does, so every merge
# gets its release.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/version.sh

  scan:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &images
        include:
          # Portal, castord, monitor, Telegram bot and admin CLI: one image,
          # one container each. The control plane runs on amd64.
          - name: castor
            image: castorcloud
            context: .
            file: Dockerfile
            platforms: linux/amd64
          # Runs per tenant on nodes.
          - name: assistant-tools
            image: castorcloud-assistant-tools
            context: .
            file: agent/tools/Dockerfile
            platforms: linux/amd64,linux/arm64
          # Egress proxy of custom stacks, on every stacks node.
          - name: egress
            image: castorcloud-egress
            context: infra/node/egress
            file: infra/node/egress/Dockerfile
            platforms: linux/amd64,linux/arm64
          # Privileged LUKS helper on nodes; kept apart so nothing else runs privileged.
          - name: cryptd
            image: castorcloud-cryptd
            context: infra/node/cryptd
            file: infra/node/cryptd/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # HIGH and CRITICAL with a fix available fail the build. Accepted
      # findings live in .trivyignore, each with an expiry date.
      - name: Scan
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 --no-progress

  publish:
    name: Publish (${{ matrix.name }})
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    needs: [version, scan]
    runs-on: ubuntu-latest
    # arm64 builds run under emulation.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push images to GHCR
    strategy:
      fail-fast: false
      matrix: *images
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      COSIGN_KEY_SET: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
      TAG: ${{ needs.version.outputs.tag }}
      # Docker Hub only gets signed images, so it also needs the cosign key.
      DOCKERHUB_PUSH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && secrets.COSIGN_PRIVATE_KEY != '' }}
      DOCKERHUB_REPO: davidsteg/castorcloud
      DOCKERHUB_IMAGE: docker.io/davidsteg/castorcloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A public Docker Hub repository would publish the control plane, so
      # refuse to push unless the repository exists and is private.
      - name: Check Docker Hub repository is private
        if: env.DOCKERHUB_PUSH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          token=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg t "$DOCKERHUB_TOKEN" '{identifier: $u, secret: $t}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- https://hub.docker.com/v2/auth/token \
            | jq -er .access_token)
          echo "::add-mask::$token"
          private=$(curl -fsS -H "Authorization: Bearer $token" "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/" | jq -r .is_private)
          if [ "$private" != "true" ]; then
            echo "::error::Docker Hub repository ${DOCKERHUB_REPO} is not private (is_private=${private}); not pushing."
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_PUSH == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags: the full commit SHA (immutable, what deployments pin), the
      # version and, for pushes to main, main.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ env.TAG }}
          labels: org.opencontainers.image.version=${{ env.TAG }}

      # One Docker Hub repository for all images: <name>-<version>,
      # <name>-<commit SHA>, and <name>-latest unless it is a pre-release.
      - id: hub
        if: env.DOCKERHUB_PUSH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.name }}-${{ env.TAG }}
            type=sha,format=long,prefix=${{ matrix.name }}-
            type=raw,value=${{ matrix.name }}-latest,enable=${{ !github.event.release.prerelease }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.hub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}

      # Signed with a private key, not keyless: keyless signing would publish
      # this private repo's name and workflow to the public Rekor log.
      # Verify with: cosign verify --key cosign.pub --insecure-ignore-tlog <image>@<digest>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.COSIGN_KEY_SET == 'true'
        with:
          # v2 writes the classic <digest>.sig signatures that
          # rust/crates/castord/src/images.rs checks.
          cosign-release: v2.6.1

      - name: Sign
        if: env.COSIGN_KEY_SET == 'true'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_KEY --tlog-upload=false "${IMAGE}@${DIGEST}"
          if [ "$DOCKERHUB_PUSH" = "true" ]; then
            cosign sign --yes --key env://COSIGN_KEY --tlog-upload=false "${DOCKERHUB_IMAGE}@${DIGEST}"
          fi

      - name: Unsigned
        if: env.COSIGN_KEY_SET != 'true'
        run: echo "::notice::COSIGN_PRIVATE_KEY is not set, so ${IMAGE} is not signed."

      - name: Not on Docker Hub
        if: github.event_name == 'release' && env.DOCKERHUB_PUSH != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME, DOCKERHUB_TOKEN or COSIGN_PRIVATE_KEY is not set, so nothing is pushed to ${DOCKERHUB_IMAGE}."

      - name: Summary
        env:
          MATRIX_NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pushed \`${IMAGE}@${DIGEST}\` (tag \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DOCKERHUB_PUSH" = "true" ]; then
            echo "Pushed \`${DOCKERHUB_IMAGE}@${DIGEST}\` (tag \`${MATRIX_NAME}-${TAG}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Created with GITHUB_TOKEN, so it does not start this workflow again.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes
          echo "Released \`${TAG}\` at \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
