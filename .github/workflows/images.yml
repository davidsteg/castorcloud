name: Images

# Builds every image this repo ships and scans it with Trivy. Pull requests
# build and scan only; main also pushes multi-arch images (amd64 for TrueNAS,
# arm64 for Mac minis) to GHCR with an SBOM and build provenance, and signs
# them with cosign when the COSIGN_PRIVATE_KEY secret is set.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build and scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &images
        include:
          # Portal, worker, monitor and Telegram bot: one image, one container each.
          - name: castor
            image: castorcloud
            context: .
            file: Dockerfile
          # Runs per tenant on nodes.
          - name: assistant-tools
            image: castorcloud-assistant-tools
            context: .
            file: agent/tools/Dockerfile
          # Privileged LUKS helper on nodes; kept apart so nothing else runs privileged.
          - name: cryptd
            image: castorcloud-cryptd
            context: infra/node/cryptd
            file: infra/node/cryptd/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # HIGH and CRITICAL with a fix available fail the build. Accepted
      # findings live in .trivyignore, each with an expiry date.
      - name: Scan
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 --no-progress

  publish:
    name: Publish (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
    strategy:
      fail-fast: false
      matrix: *images
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      COSIGN_KEY_SET: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the full commit SHA (immutable, what deployments pin) and main.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}

      # Signed with a private key, not keyless: keyless signing would publish
      # this private repo's name and workflow to the public Rekor log.
      # Verify with: cosign verify --key cosign.pub --insecure-ignore-tlog <image>@<digest>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.COSIGN_KEY_SET == 'true'
        with:
          # v2 writes the classic <digest>.sig signatures that
          # apps/provisioner/src/verify-image.ts checks.
          cosign-release: v2.6.1

      - name: Sign
        if: env.COSIGN_KEY_SET == 'true'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_KEY --tlog-upload=false "${IMAGE}@${DIGEST}"

      - name: Unsigned
        if: env.COSIGN_KEY_SET != 'true'
        run: echo "::notice::COSIGN_PRIVATE_KEY is not set, so ${IMAGE} is not signed."

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed \`${IMAGE}@${DIGEST}\` (tag \`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
