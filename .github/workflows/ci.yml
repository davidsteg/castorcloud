name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Docs alone don't need a build.
    paths-ignore: ["**.md", "docs/**"]

# Actions minutes are limited, so runs a newer push replaces are cancelled
# and jobs can't hang for long.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # The job queue's tests (packages/core/src/jobs.db.test.ts) run against it.
      TEST_DATABASE_URL: postgresql://castor:castor@localhost:5432/castor_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castor
          POSTGRES_PASSWORD: castor
          POSTGRES_DB: castor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U castor" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated code; @pc/db and its dependents need it to typecheck.
      - run: npm run db:generate

      - run: npm run typecheck

      - name: Apply the migrations to the test database
        run: npx prisma migrate deploy
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm test

      # castord checks stacks the way @pc/stacks (the portal) does; a change to
      # one without the other fails here.
      - name: castord's stack checks match @pc/stacks
        working-directory: rust/crates/castord/tests/fixtures
        run: |
          node --experimental-strip-types gen-stacks.mts > stacks.json
          git diff --exit-code stacks.json

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    env:
      # castord's queue tests run against the real schema.
      TEST_DATABASE_URL: postgresql://castor:castor@localhost:5432/castor_test
      REQUIRE_TEST_DATABASE: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castor
          POSTGRES_PASSWORD: castor
          POSTGRES_DB: castor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U castor" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Prisma migrations, in order, as the control plane applies them.
      - name: Apply the migrations to the test database
        run: |
          for f in packages/db/prisma/migrations/*/migration.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        working-directory: .

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - run: cargo fmt --all -- --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked

      # Known-vulnerable or yanked dependencies fail the build.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

      # The stacks nodes' egress proxy: its own crate, built on each node from
      # infra/node/egress alone, so it has its own lockfile.
      - name: Egress proxy
        working-directory: infra/node/egress
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo audit --deny warnings
          docker build -q -t castor.local/egress:2 .

      # The assistant's read-only MCP tools: their own crate too, built on each
      # node into the tenant image (castord's node.rs), so they have their own
      # lockfile. The key-issuing tests use the test database above.
      - name: Assistant tools
        working-directory: agent/tools
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo audit --deny warnings
          docker build -q -t pc-assistant-tools:2 -f Dockerfile ../..

      # The node helpers (castor-ssh, castor-zfs, castor-snap) as one static
      # binary for TrueNAS SCALE; cargo test above already ran its tests. The
      # artifact goes to infra/node/bin/castor-node before running the node's
      # setup script, so only main's builds are kept.
      - run: cargo build --locked --release -p castor-node --target x86_64-unknown-linux-musl

      - name: Checksum
        run: |
          cd target/x86_64-unknown-linux-musl/release
          shasum -a 256 castor-node > castor-node.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: castor-node-x86_64-unknown-linux-musl
          path: |
            rust/target/x86_64-unknown-linux-musl/release/castor-node
            rust/target/x86_64-unknown-linux-musl/release/castor-node.sha256
          if-no-files-found: error
          retention-days: 30
