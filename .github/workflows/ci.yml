name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # The job queue's tests (packages/core/src/jobs.db.test.ts) run against it.
      TEST_DATABASE_URL: postgresql://castor:castor@localhost:5432/castor_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castor
          POSTGRES_PASSWORD: castor
          POSTGRES_DB: castor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U castor" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Prisma client is generated code; @pc/db and its dependents need it to typecheck.
      - run: npm run db:generate

      - run: npm run typecheck

      - name: Apply the migrations to the test database
        run: npx prisma migrate deploy
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: npm test

      # castord renders tenant files the way tenant.ts does and checks stacks
      # the way @pc/stacks does; a change to one without the other fails here.
      - name: castord's fixtures match tenant.ts and @pc/stacks
        working-directory: rust/crates/castord/tests/fixtures
        run: |
          node --experimental-strip-types gen-render.mts > render.json
          node --experimental-strip-types gen-stacks.mts > stacks.json
          git diff --exit-code render.json stacks.json

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      # castord's queue tests run against the real schema.
      TEST_DATABASE_URL: postgresql://castor:castor@localhost:5432/castor_test
      REQUIRE_TEST_DATABASE: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: castor
          POSTGRES_PASSWORD: castor
          POSTGRES_DB: castor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U castor" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The Prisma migrations, in order, as the control plane applies them.
      - name: Apply the migrations to the test database
        run: |
          for f in packages/db/prisma/migrations/*/migration.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo fmt --all -- --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked

      # Known-vulnerable or yanked dependencies fail the build.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  # The node helpers (castor-ssh, castor-zfs, castor-snap) as one static
  # binary per node platform, tested on that platform. The artifact goes to
  # infra/node/bin/castor-node before running the node's setup script.
  castor-node:
    name: castor-node (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - run: cargo test --locked -p castor-node

      - run: cargo build --locked --release -p castor-node --target ${{ matrix.target }}

      - name: Checksum
        run: |
          cd target/${{ matrix.target }}/release
          shasum -a 256 castor-node > castor-node.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: castor-node-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/castor-node
            rust/target/${{ matrix.target }}/release/castor-node.sha256
          if-no-files-found: error
