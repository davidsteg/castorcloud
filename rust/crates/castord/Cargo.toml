[package]
name = "castord"
description = "The control plane's worker: takes tenant lifecycle jobs from the Postgres queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "net", "sync"] }
thiserror = "2.0.21"
async-trait = "0.1"
castor-crypto = { path = "../crypto" }
getrandom = "0.4.3"
hex = "0.4.3"
sha2 = "0.11.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zeroize = "1.9.1"
flate2 = "1.1.10"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
ring = "0.17.14"
base64 = "0.23.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "builder"] }

[lints]
workspace = true
