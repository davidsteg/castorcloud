[package]
name = "castord"
description = "The control plane's worker: takes tenant lifecycle jobs from the Postgres queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
thiserror = "2.0.21"
async-trait = "0.1"

[lints]
workspace = true
