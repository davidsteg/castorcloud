[package]
name = "castord"
description = "The control plane's worker: takes tenant lifecycle jobs from the Postgres queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "net"] }
thiserror = "2.0.21"
async-trait = "0.1"
castor-crypto = { path = "../crypto" }
getrandom = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde_json = "1"
zeroize = "1.9.1"

[lints]
workspace = true
