# The Next.js portal: in development on the host (npm run dev), in
# production the portal container (PORTAL_URL, docker-compose.prod.yml).
# app.<domain> = signup/marketing/admin, <slug>.<domain> = tenant shell.
# Service hosts (photos-<slug>.<domain>, ...) and auth.<domain> have
# explicit Host() routers with higher priority, so they never reach the portal.
http:
  routers:
    portal:
      rule: 'HostRegexp(`^[a-z0-9-]+\.{{ env "BASE_DOMAIN" }}$`)'
      entryPoints: [websecure]
      service: portal
      # Below the Host() routers such as auth.<domain>.
      priority: 1
  services:
    portal:
      loadBalancer:
        servers:
          - url: '{{ env "PORTAL_URL" | default "http://host.docker.internal:3000" }}'
