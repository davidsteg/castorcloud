# Sign-in in front of customers' custom stacks (docs/stacks.md). Each
# tenant's stacks-<slug>.yml (written by the provisioner) puts these two
# middlewares on every stack host:
#   castor-stack-strip  drops identity headers a client might send itself,
#                       so a stack only ever sees the ones Authentik set
#   castor-stack-auth   Authentik's embedded outpost decides: signed in and in
#                       the tenant's group, or off to the login page
http:
  middlewares:
    castor-stack-strip:
      headers:
        customRequestHeaders:
          X-authentik-username: ""
          X-authentik-groups: ""
          X-authentik-entitlements: ""
          X-authentik-email: ""
          X-authentik-name: ""
          X-authentik-uid: ""
          X-authentik-jwt: ""
          X-authentik-meta-jwks: ""
          X-authentik-meta-outpost: ""
          X-authentik-meta-provider: ""
          X-authentik-meta-app: ""
          X-authentik-meta-version: ""
    castor-stack-auth:
      forwardAuth:
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        # The client's own X-Forwarded-* are not trusted (default); Traefik sets them.
        trustForwardHeader: false
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
