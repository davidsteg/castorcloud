# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Authentik sessions last as long as portal sessions (Auth.js maxAge in
# apps/portal/src/auth.ts). Authentik's default ends the session with the
# browser, while the portal stays signed in for 30 days: after a restart the
# embedded services then needed a fresh Authentik login, which Authentik
# refuses to show inside a frame.
#
# Every login stage a customer can pass through: password login, Google
# login, Google sign-up, and e-mail sign-up (its flow is instantiated by the
# provisioner from Authentik's examples; this creates or updates the stage by
# name, whichever comes first).
version: 1
metadata:
  name: personal-cloud-sessions
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-authentication-login
    attrs:
      session_duration: days=30
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-source-authentication-login
    attrs:
      session_duration: days=30
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-source-enrollment-login
    attrs:
      session_duration: days=30
  - model: authentik_stages_user_login.userloginstage
    identifiers:
      name: default-enrollment-user-login
    attrs:
      session_duration: days=30
