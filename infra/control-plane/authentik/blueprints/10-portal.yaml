# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Registers the customer portal as an OIDC client and brands the login pages.
# Per-tenant service apps (photos/docs/places/flights) are created by the
# provisioner through the Authentik API, not here.
version: 1
metadata:
  name: personal-cloud-portal
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_brands.brand
    identifiers:
      domain: !Format ["auth.%s", !Env PC_BASE_DOMAIN]
    attrs:
      domain: !Format ["auth.%s", !Env PC_BASE_DOMAIN]
      branding_title: !Env PC_BRAND_NAME
      default: false

  - model: authentik_providers_oauth2.oauth2provider
    id: portal-provider
    identifiers:
      name: portal
    attrs:
      name: portal
      client_type: confidential
      client_id: !Env PC_PORTAL_CLIENT_ID
      client_secret: !Env PC_PORTAL_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        # Portal callback on the apex app host and on any tenant host.
        - matching_mode: regex
          url: !Format ['^%s://([a-z0-9-]+)\.%s/api/auth/callback/authentik$', !Env PC_PUBLIC_SCHEME, !Env PC_BASE_DOMAIN]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: portal
    attrs:
      name: !Env PC_BRAND_NAME
      slug: portal
      provider: !KeyOf portal-provider
      meta_launch_url: !Format ["%s://app.%s", !Env PC_PUBLIC_SCHEME, !Env PC_BASE_DOMAIN]
