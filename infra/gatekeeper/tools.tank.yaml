  - id: "docker.revoke_flights"
    toolkit: "docker"
    version: 1
    title: "End a person's AirTrail sessions"
    description: "Deletes the person's AirTrail sessions (and keys and grants unless web)."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "compose"
      - "-p"
      - "pc-t-{slug}"
      - "-f"
      - "/mnt/tank/castor/node/files/templates/tenant/compose.yml"
      - "--project-directory"
      - "/mnt/tank/castor/node/files/templates/tenant"
      - "-f"
      - "{volumes_file}"
      - "--env-file"
      - "{env_file}"
      - "exec"
      - "-T"
      - "db"
      - "psql"
      - "-X"
      - "-q"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-U"
      - "postgres"
      - "-d"
      - "airtrail"
      - "-v"
      - "sub={sub}"
      - "-v"
      - "web={web}"
      - "-v"
      - "keep={keep}"
    stdin: "\nDELETE FROM session s USING \"user\" u WHERE s.user_id = u.id AND u.oauth_id = :'sub';\nDELETE FROM api_key k USING \"user\" u\n WHERE k.user_id = u.id AND u.oauth_id = :'sub' AND NOT :'web'::boolean AND k.name <> :'keep';\nDELETE FROM oauth_grant g USING \"user\" u\n WHERE g.user_id = u.id AND u.oauth_id = :'sub' AND NOT :'web'::boolean;\n"
    parameters:
      slug:
        type: "string"
        pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "The tenant's slug."
      sub:
        type: "string"
        pattern: "^[A-Za-z0-9._:@|-]{1,255}$"
        required: true
        description: "The person's OIDC subject."
      web:
        type: "enum"
        values: ["true","false"]
        required: true
        description: "Browser sessions only."
      keep:
        type: "string"
        pattern: "^(?:Castor\\ assistant\\ \\(read\\-only\\))?$"
        required: true
        description: "API key name to keep, or empty."
      volumes_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/compose.volumes.yml"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
