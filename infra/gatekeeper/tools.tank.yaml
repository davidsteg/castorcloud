  - id: "docker.revoke_photos"
    toolkit: "docker"
    version: 1
    title: "End a person's Immich sessions"
    description: "Deletes the person's Immich sessions (and API keys unless web) in the tenant's database."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "compose"
      - "-p"
      - "pc-t-{slug}"
      - "-f"
      - "/mnt/tank/castor/node/files/templates/tenant/compose.yml"
      - "--project-directory"
      - "/mnt/tank/castor/node/files/templates/tenant"
      - "-f"
      - "{volumes_file}"
      - "--env-file"
      - "{env_file}"
      - "exec"
      - "-T"
      - "immich-db"
      - "psql"
      - "-X"
      - "-q"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-U"
      - "immich"
      - "-d"
      - "immich"
      - "-v"
      - "email={email}"
      - "-v"
      - "before={before}"
      - "-v"
      - "web={web}"
      - "-v"
      - "keep={keep}"
    stdin: "\nDELETE FROM session s USING \"user\" u\n WHERE s.\"userId\" = u.id AND lower(u.email) = lower(:'email') AND s.\"createdAt\" < :'before'::timestamptz\n   AND (NOT :'web'::boolean OR s.\"appVersion\" IS NULL);\nDELETE FROM api_key k USING \"user\" u\n WHERE k.\"userId\" = u.id AND lower(u.email) = lower(:'email')\n   AND NOT :'web'::boolean AND k.name <> :'keep';\n"
    parameters:
      slug:
        type: "string"
        pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "The tenant's slug."
      email:
        type: "string"
        pattern: "^[^\\s\\x00-\\x1f\\x7f]{3,254}$"
        required: true
        description: "The person's e-mail address."
      before:
        type: "string"
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
        required: true
        description: "Sessions created before this end."
      web:
        type: "enum"
        values: ["true","false"]
        required: true
        description: "Browser sessions only."
      keep:
        type: "string"
        pattern: "^(?:Castor\\ assistant\\ \\(read\\-only\\))?$"
        required: true
        description: "API key name to keep, or empty."
      volumes_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/compose.volumes.yml"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
        description: "Built by gatekeeper from the slug."
      env_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/tenant.env"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
        description: "Built by gatekeeper from the slug."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "docker.revoke_docs"
    toolkit: "docker"
    version: 1
    title: "End a person's Paperless sessions"
    description: "Sets an unusable password (and deletes API tokens unless WEB) for the person in Paperless."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "compose"
      - "-p"
      - "pc-t-{slug}"
      - "-f"
      - "/mnt/tank/castor/node/files/templates/tenant/compose.yml"
      - "--project-directory"
      - "/mnt/tank/castor/node/files/templates/tenant"
      - "-f"
      - "{volumes_file}"
      - "--env-file"
      - "{env_file}"
      - "exec"
      - "-T"
      - "-e"
      - "PC_EMAIL={email}"
      - "-e"
      - "PC_SCOPE={scope}"
      - "paperless"
      - "python3"
      - "manage.py"
      - "shell"
      - "--no-imports"
    stdin: "\nimport os\nfrom django.contrib.auth.models import User\nfrom rest_framework.authtoken.models import Token\nfor user in User.objects.filter(email__iexact=os.environ[\"PC_EMAIL\"]).exclude(email=\"\"):\n    user.set_unusable_password()\n    user.save(update_fields=[\"password\"])\n    if os.environ[\"PC_SCOPE\"] != \"WEB\":\n        Token.objects.filter(user=user).delete()\n"
    parameters:
      slug:
        type: "string"
        pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "The tenant's slug."
      email:
        type: "string"
        pattern: "^[^\\s\\x00-\\x1f\\x7f]{3,254}$"
        required: true
        description: "The person's e-mail address."
      scope:
        type: "enum"
        values: ["WEB","DEVICES","REMOVED"]
        required: true
        description: "What to end."
      volumes_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/compose.volumes.yml"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
        description: "Built by gatekeeper from the slug."
      env_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/tenant.env"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
        description: "Built by gatekeeper from the slug."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "docker.revoke_places"
    toolkit: "docker"
    version: 1
    title: "End a person's Dawarich sessions"
    description: "Sets a random password (and API key unless WEB) for the person in Dawarich."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "compose"
      - "-p"
      - "pc-t-{slug}"
      - "-f"
      - "/mnt/tank/castor/node/files/templates/tenant/compose.yml"
      - "--project-directory"
      - "/mnt/tank/castor/node/files/templates/tenant"
      - "-f"
      - "{volumes_file}"
      - "--env-file"
      - "{env_file}"
      - "exec"
      - "-T"
      - "-e"
      - "PC_EMAIL={email}"
      - "-e"
      - "PC_SCOPE={scope}"
      - "dawarich"
      - "bin/rails"
      - "runner"
      - "\nuser = User.where(\"lower(email) = ?\", ENV.fetch(\"PC_EMAIL\").downcase).first\nif user\n  user.update_columns(encrypted_password: Devise::Encryptor.digest(User, SecureRandom.hex(32)))\n  user.update_columns(api_key: SecureRandom.hex(32)) unless ENV.fetch(\"PC_SCOPE\") == \"WEB\"\nend\n"
    parameters:
      slug:
        type: "string"
        pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "The tenant's slug."
      email:
        type: "string"
        pattern: "^[^\\s\\x00-\\x1f\\x7f]{3,254}$"
        required: true
        description: "The person's e-mail address."
      scope:
        type: "enum"
        values: ["WEB","DEVICES","REMOVED"]
        required: true
        description: "What to end."
      volumes_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/compose.volumes.yml"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
        description: "Built by gatekeeper from the slug."
      env_file:
        type: "path"
        derived: "/mnt/tank/castor/node/tenants/{slug}/tenant.env"
        must_resolve_under: "/mnt/tank/castor/node/tenants"
