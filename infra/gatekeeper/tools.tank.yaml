      - "pc-t-{slug}-shared"
    parameters:
      slug:
        type: "string"
        pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "The tenant's slug."
    required_scopes: []
    timeout_seconds: 60
    max_output_bytes: 1048576
  - id: "docker.network_rm_llm"
    toolkit: "docker"
    version: 1
    title: "Remove a tenant's LLM network"
    description: "Removes pc-t-<slug>-llm."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "network"
      - "rm"
      - "pc-t-{slug}-llm"
    parameters:
      slug:
        type: "string"
        pattern: "^[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "The tenant's slug."
    required_scopes: []
    timeout_seconds: 60
    max_output_bytes: 1048576
  - id: "docker.edge_network_create"
    toolkit: "docker"
    version: 1
    title: "Create pc-edge"
    description: "Creates the network the control-plane Traefik reaches the tenants' skin proxies on."
    category: "write"
    idempotent: false
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "network"
      - "create"
      - "pc-edge"
    parameters: {}
    required_scopes: []
    timeout_seconds: 60
    max_output_bytes: 1048576
  - id: "docker.edge_network_inspect"
    toolkit: "docker"
    version: 1
    title: "Look at pc-edge"
    description: "docker network inspect pc-edge."
    category: "read"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "network"
      - "inspect"
      - "pc-edge"
    parameters: {}
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "docker.version"
    toolkit: "docker"
    version: 1
    title: "Docker version"
    description: "The Docker engine's version."
    category: "read"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "version"
      - "--format"
      - "{{.Server.Version}}"
    parameters: {}
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "docker.image_pull"
    toolkit: "docker"
    version: 1
    title: "Pull a signed image"
    description: "Pulls an image by digest; castord verified its signature first."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "pull"
      - "-q"
      - "{image}"
    parameters:
      image:
        type: "string"
        pattern: "^[a-z0-9._-]+(?:/[a-z0-9._-]+)+@sha256:[0-9a-f]{64}$"
        required: true
        description: "repo@sha256:<digest>."
    required_scopes: []
    timeout_seconds: 900
    max_output_bytes: 1048576
  - id: "docker.image_tag"
    toolkit: "docker"
    version: 1
    title: "Tag a pulled image"
    description: "Gives a pulled image the local name the stacks use."
    category: "write"
    idempotent: true
    enabled: true
    binary: "/usr/bin/docker"
    argv:
      - "tag"
      - "{image}"
      - "{tag}"
    parameters:
      image:
        type: "string"
        pattern: "^[a-z0-9._-]+(?:/[a-z0-9._-]+)+@sha256:[0-9a-f]{64}$"
        required: true
        description: "repo@sha256:<digest>."
      tag:
        type: "enum"
        values: ["pc-assistant-tools:2"]
        required: true
        description: "The local name."
    required_scopes: []
    timeout_seconds: 60
    max_output_bytes: 1048576
  - id: "truenas.pool_query"
    toolkit: "truenas"
    version: 1
    title: "Castor's pool"
    description: "Health, size and allocation of the pool tenant datasets live on."
    category: "read"
    idempotent: true
    enabled: true
    method: "pool.query"
    params:
      filters: [["name","=","tank"]]
    parameters: {}
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "truenas.system_info"
    toolkit: "truenas"
    version: 1
    title: "The NAS"
    description: "TrueNAS version, memory and cores."
    category: "read"
    idempotent: true
    enabled: true
    method: "system.info"
    params: {}
    parameters: {}
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "truenas.dataset_query"
    toolkit: "truenas"
    version: 1
    title: "A tenant's dataset"
    description: "Whether it exists and is unlocked, its quota, and what it and each data directory use."
    category: "read"
    idempotent: true
    enabled: true
    method: "pool.dataset.query"
    params:
      filters: [["id","=","{dataset}"]]
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.dataset_create"
    toolkit: "truenas"
    version: 1
    title: "Create a tenant's dataset"
    description: "An encryption root of its own (AES-256-GCM, passphrase), with the booked quota."
    category: "write"
    idempotent: true
    enabled: true
    method: "pool.dataset.create"
    params:
      data: {"name":"{dataset}","quota":"{quota}","encryption":true,"inherit_encryption":false,"encryption_options":{"algorithm":"AES-256-GCM","passphrase":"{passphrase}"}}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
      quota:
        type: "integer"
        minimum: 1048576
        maximum: 1125899906842624
        required: true
        description: "The quota in bytes."
      passphrase:
        type: "string"
        pattern: "^[0-9a-f]{64}$"
        required: true
        secret: true
        description: "HKDF of the tenant's volume key; TrueNAS never stores it."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.dataset_create_dir"
    toolkit: "truenas"
    version: 1
    title: "Create a data directory"
    description: "A child dataset of an unlocked tenant dataset; it inherits the key and the mount."
    category: "write"
    idempotent: true
    enabled: true
    method: "pool.dataset.create"
    params:
      data: {"name":"{dataset}"}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]/[a-z0-9-]{1,40}$"
        required: true
        description: "<pool>/castor/t/<slug>/<dir>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.dataset_unlock"
    toolkit: "truenas"
    version: 1
    title: "Unlock a tenant's dataset"
    description: "Unlocks and mounts it with its children. A job: castord confirms with dataset_query."
    category: "write"
    idempotent: true
    enabled: true
    method: "pool.dataset.unlock"
    params:
      id: "{dataset}"
      options: {"recursive":true,"datasets":[{"name":"{dataset}","passphrase":"{passphrase}"}]}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
      passphrase:
        type: "string"
        pattern: "^[0-9a-f]{64}$"
        required: true
        secret: true
        description: "HKDF of the tenant's volume key; TrueNAS never stores it."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.dataset_lock"
    toolkit: "truenas"
    version: 1
    title: "Lock a tenant's dataset"
    description: "Unmounts and locks it; its stacks are stopped first. A job: castord confirms with dataset_query."
    category: "write"
    idempotent: true
    enabled: true
    method: "pool.dataset.lock"
    params:
      id: "{dataset}"
      options: {"force_umount":false}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.dataset_quota"
    toolkit: "truenas"
    version: 1
    title: "Set a tenant's quota"
    description: "Online; TrueNAS refuses a quota below what is used, and castord checks first."
    category: "write"
    idempotent: true
    enabled: true
    method: "pool.dataset.update"
    params:
      id: "{dataset}"
      data: {"quota":"{quota}"}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
      quota:
        type: "integer"
        minimum: 1048576
        maximum: 1125899906842624
        required: true
        description: "The quota in bytes."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.dataset_delete"
    toolkit: "truenas"
    version: 1
    title: "Destroy a tenant's dataset"
    description: "With its data directories and snapshots. Irreversible; castord then deletes the key."
    category: "write"
    idempotent: true
    enabled: true
    method: "pool.dataset.delete"
    params:
      id: "{dataset}"
      options: {"recursive":true,"force":true}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.snapshot_create"
    toolkit: "truenas"
    version: 1
    title: "Snapshot a tenant for backup"
    description: "A recursive snapshot cb-<UTC time> of the tenant's dataset, for the replication task to send."
    category: "write"
    idempotent: true
    enabled: true
    method: "zfs.snapshot.create"
    params:
      data: {"dataset":"{dataset}","name":"{snapshot}","recursive":true}
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
      snapshot:
        type: "string"
        pattern: "^cb-[0-9]{8}T[0-9]{4}Z$"
        required: true
        description: "cb-<UTC time>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.snapshot_query"
    toolkit: "truenas"
    version: 1
    title: "A tenant's backup snapshots"
    description: "The snapshots of the tenant's dataset."
    category: "read"
    idempotent: true
    enabled: true
    method: "zfs.snapshot.query"
    params:
      filters: [["dataset","=","{dataset}"]]
    parameters:
      dataset:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]$"
        required: true
        description: "<pool>/castor/t/<slug>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.snapshot_delete"
    toolkit: "truenas"
    version: 1
    title: "Drop a backup snapshot"
    description: "Only cb-* snapshots of tenant datasets; what the backup box keeps is its replication task's retention."
    category: "write"
    idempotent: true
    enabled: true
    method: "zfs.snapshot.delete"
    params:
      id: "{snapshot}"
      options: {"recursive":true}
    parameters:
      snapshot:
        type: "string"
        pattern: "^tank/castor/t/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9]@cb-[0-9]{8}T[0-9]{4}Z$"
        required: true
        description: "<pool>/castor/t/<slug>@cb-<UTC time>."
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.replication_run"
    toolkit: "truenas"
    version: 1
    title: "Send the backups"
    description: "Runs the replication task to the backup box that the operator set up (raw, encrypted)."
    category: "write"
    idempotent: true
    enabled: true
    method: "replication.run"
    params:
      id: 1
    parameters: {}
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "truenas.replication_query"
    toolkit: "truenas"
    version: 1
    title: "How the backups went"
    description: "The replication task's state: running, finished or failed, and when."
    category: "read"
    idempotent: true
    enabled: true
    method: "replication.query"
    params:
      filters: [["id","=",1]]
    parameters: {}
    required_scopes: []
    timeout_seconds: 120
    max_output_bytes: 1048576
  - id: "file.tenant_write"
    toolkit: "file"
    version: 1
    title: "Write a tenant file (owner only)"
    description: "Writes a file below tenants/<slug> with mode 0600 (tenant.env, immich.json, ...)."
    category: "write"
    idempotent: true
    enabled: true
    executor: "file"
    file_operation: "write"
    file_mode: "0600"
    parameters:
      path:
        type: "string"
        pattern: "^/mnt/tank/castor/node/tenants/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9](?:/[A-Za-z0-9_=-][A-Za-z0-9._=-]*)+$"
        required: true
        description: "tenants/<slug>/<file>."
      content:
        type: "string"
        pattern: "^[\\s\\S]*$"
        allow_control_characters: true
        required: true
        secret: true
        description: "The file's content."
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "file.tenant_write_readable"
    toolkit: "file"
    version: 1
    title: "Write a tenant file (readable)"
    description: "Writes a file below tenants/<slug> with mode 0644, for unprivileged containers."
    category: "write"
    idempotent: true
    enabled: true
    executor: "file"
    file_operation: "write"
    file_mode: "0644"
    parameters:
      path:
        type: "string"
        pattern: "^/mnt/tank/castor/node/tenants/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9](?:/[A-Za-z0-9_=-][A-Za-z0-9._=-]*)+$"
        required: true
        description: "tenants/<slug>/<file>."
      content:
        type: "string"
        pattern: "^[\\s\\S]*$"
        allow_control_characters: true
        required: true
        secret: true
        description: "The file's content."
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "file.tenant_delete"
    toolkit: "file"
    version: 1
    title: "Remove tenant files"
    description: "Removes tenants/<slug> or a directory below it."
    category: "write"
    idempotent: true
    enabled: true
    executor: "file"
    file_operation: "delete"
    parameters:
      path:
        type: "string"
        pattern: "^/mnt/tank/castor/node/tenants/[a-z0-9](?:[a-z0-9]|-(?!-)){1,28}[a-z0-9](?:/[A-Za-z0-9_=-][A-Za-z0-9._=-]*)*$"
        required: true
        description: "tenants/<slug>[/<dir>]."
    required_scopes: []
    timeout_seconds: 60
    max_output_bytes: 1048576
  - id: "file.node_write"
    toolkit: "file"
    version: 1
    title: "Write a node file"
    description: "Writes one file of the templates, shared services, brand assets or CA bundle (0644)."
    category: "write"
    idempotent: true
    enabled: true
    executor: "file"
    file_operation: "write"
    file_mode: "0644"
    parameters:
      path:
        type: "string"
        pattern: "^/mnt/tank/castor/node/files/(?:templates|node|brand|ca)(?:/[A-Za-z0-9_=-][A-Za-z0-9._=-]*)+$"
        required: true
        description: "Below <root>/files."
      content:
        type: "string"
        pattern: "^[\\s\\S]*$"
        allow_control_characters: true
        required: true
        secret: true
        description: "The file's content."
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
  - id: "file.node_delete"
    toolkit: "file"
    version: 1
    title: "Remove a node file set"
    description: "Removes files/<templates|node|brand|ca> before castord writes it again."
    category: "write"
    idempotent: true
    enabled: true
    executor: "file"
    file_operation: "delete"
    parameters:
      path:
        type: "string"
        pattern: "^/mnt/tank/castor/node/files/(?:templates|node|brand|ca)$"
        required: true
        description: "Below <root>/files."
    required_scopes: []
    timeout_seconds: 60
    max_output_bytes: 1048576
  - id: "file.shared_env_write"
    toolkit: "file"
    version: 1
    title: "Write the shared services' settings"
    description: "Writes <root>/shared.env (0600): versions and the LLM gateway's keys."
    category: "write"
    idempotent: true
    enabled: true
    executor: "file"
    file_operation: "write"
    file_mode: "0600"
    parameters:
      path:
        type: "enum"
        values: ["/mnt/tank/castor/node/shared.env"]
        required: true
        description: "<root>/shared.env."
      content:
        type: "string"
        pattern: "^[\\s\\S]*$"
        allow_control_characters: true
        required: true
        secret: true
        description: "The env file."
    required_scopes: []
    timeout_seconds: 30
    max_output_bytes: 1048576
