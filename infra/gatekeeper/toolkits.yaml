# Tier 1 of gatekeeper-castor, the gatekeeper instance of one TrueNAS that
# runs Castor (docs/gatekeeper.md). An EXAMPLE for the pool "tank": replace
# every /mnt/tank with your pool's path. Mounted read-only; a change needs a
# redeploy. Tier 2 is tools.<pool>.yaml, generated by
#   castor-admin gatekeeper tools <pool>
#
# This instance serves one caller, the castor node role, and nothing else:
# run it without --ui, and keep /admin/mcp unused (no identity holds an admin
# role), so no agent can propose tools or grants here.

toolkits:
  # Compose, networks and images of the tenant stacks. Every tool is a fixed
  # argv; its only variable parts are checked parameters (slug, service,
  # e-mail ...). The compose files and env files gatekeeper's docker CLI
  # reads are below the node root.
  docker:
    executor: docker
    binaries:
      - /usr/bin/docker
    # Words no castor tool uses. A parameter value that resolves to one of
    # them is refused as well (FR-4.2).
    denied_args:
      - run
      - cp
      - build
      - buildx
      - push
      - login
      - logout
      - system
      - prune
      - attach
      - commit
      - save
      - load
      - import
      - export
      - plugin
      - swarm
      - secret
      - context
      - --privileged
      - --rmi
      - -H
      - --host
      - --context
    path_roots:
      - /mnt/tank/castor/node
    protected_resources:
      - castor
      - castor-node
      - gatekeeper-castor
      - authentik
      - postgres
    max_timeout_seconds: 900
    max_output_bytes: 1048576

  # Tenant files (tenant.env, compose overrides, app configs) and the node's
  # templates. No tool reads a file back.
  file:
    executor: file
    binaries: []
    path_roots:
      - /mnt/tank/castor/node
    protected_resources: [castor, castor-node, gatekeeper-castor]
    max_timeout_seconds: 30
    max_output_bytes: 65536

  # The TrueNAS middleware. A method not listed here can't be called by any
  # tool: no pool.dataset.delete outside castor/t, no service or user calls.
  # The API key is a credential named "truenas" in gatekeeper's credential
  # store, bound to a user with only dataset, snapshot and replication roles
  # if your TrueNAS version allows it.
  truenas:
    executor: truenas
    ws_url: "wss://truenas.lan/api/current"
    allowed_rpc_methods:
      - pool.query
      - system.info
      - pool.dataset.query
      - pool.dataset.create
      - pool.dataset.update
      - pool.dataset.lock
      - pool.dataset.unlock
      - pool.dataset.delete
      - zfs.snapshot.create
      - zfs.snapshot.query
      - zfs.snapshot.delete
      - replication.query
      - replication.run
    credential: truenas
    max_timeout_seconds: 900
    max_output_bytes: 1048576
